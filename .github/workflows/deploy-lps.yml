      - name: Deploy to Vercel (Production)
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AI_STYLIST }}

  deploy-mywa:
    name: Deploy mywa
    needs: changes
    if: needs.changes.outputs.mywa == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/4-active/2025-08-001-mywa/lp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
