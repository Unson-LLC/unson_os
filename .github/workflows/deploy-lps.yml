          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AI_LEGACY_CREATOR }}

  deploy-stylist:
    name: Deploy ai-stylist
    needs: changes
    if: needs.changes.outputs.stylist == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/2-validation/2025-08-005-ai-stylist/lp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'products/2-validation/2025-08-005-ai-stylist/lp/package-lock.json'
      - run: npm ci
      - run: npm run build
      - name: Pull Vercel env
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
